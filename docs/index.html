document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ly: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"427d7393-6cdb-464d-89ca-c3e5a0ba59ed\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f2aca3e9-ed15-42dd-a45c-54a02b148ff7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    * { box-sizing: border-box; }\n    html, body { margin: 0; padding: 0; background: #08080a; }\n    body { font-family: 'JetBrains Mono', ui-monospace, monospace; color: #e6e4e0; -webkit-font-smoothing: antialiased; }\n    a { color: var(--accent, #ff8a1e); text-decoration: none; }\n    a:hover { color: #ffbf5c; }\n    @keyframes blink { 0%,55%{opacity:1} 56%,100%{opacity:0} }\n    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }\n    ::selection { background: rgba(255,138,30,.28); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"--accent:{{ accent }}; background:#08080a; min-height:100%;\">\n\n  <!-- ===== nav ===== -->\n  <nav style=\"position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px; padding:16px 40px; background:rgba(8,8,10,.82); backdrop-filter:blur(12px); border-bottom:1px solid #1a1a1e;\">\n    <div style=\"display:flex; align-items:center; gap:11px;\">\n      <dc-import name=\"Orch Mark\" theme=\"dark\" show-dots=\"{{ false }}\" bw=\"6\" cw=\"10\" radius=\"8\" tile-bg=\"linear-gradient(145deg,#1c1c20,#111114)\" tile-border=\"#2a2a2e\" style=\"width:30px; height:30px; flex:none;\" hint-size=\"30px,30px\"><\u002Fdc-import>\n      <span style=\"font-size:17px; font-weight:800; letter-spacing:-.3px;\">orch<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:26px; margin-left:28px; font-size:13.5px; color:#8f8c86;\">\n      <a href=\"#loop\" style=\"color:#8f8c86;\">How it works<\u002Fa>\n      <a href=\"#features\" style=\"color:#8f8c86;\">Features<\u002Fa>\n      <a href=\"#agents\" style=\"color:#8f8c86;\">Agents<\u002Fa>\n      <a href=\"#commands\" style=\"color:#8f8c86;\">Commands<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto; display:flex; align-items:center; gap:14px;\">\n      <span style=\"font-size:12px; color:#5a5852;\">v0.2.16<\u002Fspan>\n      <a href=\"https://github.com/bbk1ng/agent-orch\" style=\"font-size:13px; color:#e6e4e0; border:1px solid #2a2a2e; padding:7px 15px; border-radius:8px;\">GitHub ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- ===== hero ===== -->\n  <header style=\"position:relative; overflow:hidden; padding:96px 40px 84px; text-align:center; background:radial-gradient(900px 500px at 50% -20%, #1c1409 0%, #08080a 60%);\">\n    <div style=\"display:inline-flex; align-items:center; gap:9px; padding:6px 14px; border:1px solid #2a2a2e; border-radius:999px; font-size:12px; color:#8f8c86; margin-bottom:30px;\">\n      <span style=\"width:6px; height:6px; border-radius:50%; background:#63c088; box-shadow:0 0 8px #63c088; animation:pulse 1.6s ease-in-out infinite;\"><\u002Fspan>\n      runs as your installed CLIs · no separate service\n    <\u002Fdiv>\n    <h1 style=\"font-size:64px; line-height:1.04; font-weight:800; letter-spacing:-2px; margin:0 auto; max-width:900px;\">\n      Two agents. <span style=\"background:linear-gradient(180deg,#ff8a1e,#ffbf5c); -webkit-background-clip:text; background-clip:text; color:transparent;\">One writes,<br>the other audits.<\u002Fspan>\n    <\u002Fh1>\n    <p style=\"font-size:18px; line-height:1.6; color:#8f8c86; max-width:640px; margin:26px auto 0; font-weight:400;\">\n      Run local coding agents — Claude, Codex, Copilot, Gemini — in a cross-audit loop on any git repo. One authors a small change; another reviews it; on agreement + green tests it merges. On disagreement, it revises. On stalemate, it asks you.\n    <\u002Fp>\n\n    <!-- install pill -->\n    <div style=\"display:flex; align-items:center; gap:14px; justify-content:center; margin-top:38px;\">\n      <div style=\"display:flex; align-items:center; gap:14px; background:#121215; border:1px solid #2a2a2e; border-radius:11px; padding:13px 18px; font-size:14.5px;\">\n        <span style=\"color:#5a5852;\">$<\u002Fspan>\n        <span style=\"color:#e6e4e0;\">npm install -g <span style=\"color:var(--accent,#ff8a1e);\">@bbk1ng/agent-orch<\u002Fspan><\u002Fspan>\n        <span style=\"width:1px; height:18px; background:#2a2a2e; margin:0 2px;\"><\u002Fspan>\n        <span style=\"color:#8f8c86; font-size:13px;\">⧉ copy<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"https://github.com/bbk1ng/agent-orch#readme\" style=\"background:var(--accent,#ff8a1e); color:#0e0e11; font-weight:700; font-size:14.5px; padding:14px 24px; border-radius:11px;\">Read the docs<\u002Fa>\n    <\u002Fdiv>\n\n    <!-- mini terminal -->\n    <div style=\"max-width:720px; margin:60px auto 0; text-align:left; border-radius:14px; overflow:hidden; border:1px solid #26262b; background:#0e0e11; box-shadow:0 40px 90px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(255,138,30,.05);\">\n      <div style=\"display:flex; align-items:center; gap:8px; padding:11px 16px; background:#17171b; border-bottom:1px solid #26262b;\">\n        <span style=\"width:11px; height:11px; border-radius:50%; background:#ff5f57;\"><\u002Fspan>\n        <span style=\"width:11px; height:11px; border-radius:50%; background:#febc2e;\"><\u002Fspan>\n        <span style=\"width:11px; height:11px; border-radius:50%; background:#28c840;\"><\u002Fspan>\n        <span style=\"margin-left:10px; font-size:11.5px; color:#6b6862;\">orch task<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:20px 22px 22px; font-size:13.5px; line-height:1.85;\">\n        <div style=\"color:#8f8c86;\"><span style=\"color:#63c088;\">~/printseek<\u002Fspan> <span style=\"color:var(--accent,#ff8a1e);\">❯<\u002Fspan> orch task <span style=\"color:#ffbf5c;\">\"fix the flaky login test\"<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:16px 60px 1fr auto; gap:12px; align-items:center; margin-top:10px;\"><span style=\"color:var(--accent,#ff8a1e);\">▸<\u002Fspan><span style=\"color:#8f8c86;\">author<\u002Fspan><span>claude authoring<\u002Fspan><span style=\"color:#63c088;\">✓ 3 commits<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:16px 60px 1fr auto; gap:12px; align-items:center;\"><span style=\"color:var(--accent,#ff8a1e);\">▸<\u002Fspan><span style=\"color:#8f8c86;\">review<\u002Fspan><span>codex · round 1<\u002Fspan><span style=\"color:#e8705d;\">✗ DISAGREE<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:16px 60px 1fr auto; gap:12px; align-items:center;\"><span style=\"color:var(--accent,#ff8a1e);\">▸<\u002Fspan><span style=\"color:#8f8c86;\">revise<\u002Fspan><span>claude · round 2<\u002Fspan><span style=\"color:#63c088;\">✓ AGREE<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:16px 60px 1fr auto; gap:12px; align-items:center;\"><span style=\"color:var(--accent,#ff8a1e);\">▸<\u002Fspan><span style=\"color:#8f8c86;\">gate<\u002Fspan><span>npm test<\u002Fspan><span style=\"color:#63c088;\">✓ 214 passed<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:16px 60px 1fr auto; gap:12px; align-items:center;\"><span style=\"color:var(--accent,#ff8a1e);\">▸<\u002Fspan><span style=\"color:#8f8c86;\">merge<\u002Fspan><span>→ orch/integration<\u002Fspan><span style=\"color:#63c088;\">✓ merged<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:10px; color:#63c088;\">✓ merged <span style=\"color:#8f8c86;\">· 2 rounds · 128k tok · $0.42<\u002Fspan> <span style=\"width:8px; height:15px; display:inline-block; background:var(--accent,#ff8a1e); vertical-align:-2px; animation:blink 1.1s step-end infinite;\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===== license note ===== -->\n  <sc-if value=\"{{ showLicenseNote }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"max-width:720px; margin:0 auto; padding:0 40px;\">\n    <div style=\"display:flex; align-items:center; gap:12px; margin-top:-30px; margin-bottom:10px; padding:11px 16px; border:1px solid #33291a; background:rgba(255,138,30,.05); border-radius:10px; font-size:12.5px; color:#a99a86;\">\n      <span>⚠<\u002Fspan><span>Source-available, non-commercial — PolyForm Noncommercial 1.0.0. Educational &amp; research use; commercial use forbidden.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== the loop ===== -->\n  <section id=\"loop\" style=\"padding:90px 40px; max-width:1080px; margin:0 auto;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:2px; color:var(--accent,#ff8a1e); text-transform:uppercase; text-align:center;\">The cross-audit loop<\u002Fdiv>\n    <h2 style=\"font-size:36px; font-weight:800; letter-spacing:-1px; text-align:center; margin:14px 0 10px;\">A cycle no single agent controls<\u002Fh2>\n    <p style=\"text-align:center; color:#8f8c86; max-width:560px; margin:0 auto 54px; font-size:15px; line-height:1.6;\">Agents never touch <span style=\"color:#e6e4e0;\">main<\u002Fspan>. Only the engine merges, and only after the reviewer agrees <span style=\"color:#5a5852;\">and<\u002Fspan> the test gate passes.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:0; align-items:stretch;\">\n      <div style=\"position:relative; padding:24px 20px; border:1px solid #22222a; border-radius:12px 0 0 12px; background:#0e0e11;\">\n        <div style=\"font-size:12px; color:#5a5852;\">01<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin:8px 0 6px; color:var(--accent,#ff8a1e);\">Author<\u002Fdiv>\n        <div style=\"font-size:13px; color:#8f8c86; line-height:1.6;\">The next agent writes a small change on an isolated worktree branch.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; padding:24px 20px; border:1px solid #22222a; border-left:none; background:#0e0e11;\">\n        <div style=\"font-size:12px; color:#5a5852;\">02<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin:8px 0 6px; color:#ffbf5c;\">Audit<\u002Fdiv>\n        <div style=\"font-size:13px; color:#8f8c86; line-height:1.6;\">A different agent reviews it read-only and returns AGREE or DISAGREE.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; padding:24px 20px; border:1px solid #22222a; border-left:none; background:#0e0e11;\">\n        <div style=\"font-size:12px; color:#5a5852;\">03<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin:8px 0 6px; color:#63c088;\">Gate<\u002Fdiv>\n        <div style=\"font-size:13px; color:#8f8c86; line-height:1.6;\">The repo's own test command runs. Red tests never merge — no exceptions.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; padding:24px 20px; border:1px solid #22222a; border-left:none; border-radius:0 12px 12px 0; background:#0e0e11;\">\n        <div style=\"font-size:12px; color:#5a5852;\">04<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin:8px 0 6px; color:#6ea8d8;\">Merge<\u002Fdiv>\n        <div style=\"font-size:13px; color:#8f8c86; line-height:1.6;\">Into orch/integration, with a persistent PR to main. GitHub owns main.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; justify-content:center; gap:22px; margin-top:22px; font-size:12.5px; color:#5a5852;\">\n      <span><span style=\"color:#e8705d;\">disagree<\u002Fspan> → capped revise loop<\u002Fspan>\n      <span style=\"color:#22222a;\">|<\u002Fspan>\n      <span><span style=\"color:#ffbf5c;\">stalemate<\u002Fspan> → decision brief, exit 2<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== features ===== -->\n  <section id=\"features\" style=\"padding:20px 40px 90px; max-width:1080px; margin:0 auto;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:2px; color:var(--accent,#ff8a1e); text-transform:uppercase; text-align:center;\">Built for unattended runs<\u002Fdiv>\n    <h2 style=\"font-size:36px; font-weight:800; letter-spacing:-1px; text-align:center; margin:14px 0 54px;\">Safety rails, all the way down<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;\">\n      <div style=\"padding:24px; border:1px solid #1e1e24; border-radius:14px; background:#0e0e11;\">\n        <div style=\"font-size:20px; margin-bottom:14px;\">⇄<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin-bottom:8px;\">Cross-vendor audit<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8f8c86; line-height:1.65;\">Diversity catches more. A Claude patch gets read by Codex — different model, different blind spots.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:24px; border:1px solid #1e1e24; border-radius:14px; background:#0e0e11;\">\n        <div style=\"font-size:20px; margin-bottom:14px;\">⏻<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin-bottom:8px;\">Local compute<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8f8c86; line-height:1.65;\">Agents run as your installed CLIs — no separate hosted service; the optional gh bridge only comments and merges PRs.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:24px; border:1px solid #1e1e24; border-radius:14px; background:#0e0e11;\">\n        <div style=\"font-size:20px; margin-bottom:14px;\">✓<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin-bottom:8px;\">Objective test gate<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8f8c86; line-height:1.65;\">Auto-detects npm, pytest, go, or make. No test command? It refuses to auto-merge and tells you.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:24px; border:1px solid #1e1e24; border-radius:14px; background:#0e0e11;\">\n        <div style=\"font-size:20px; margin-bottom:14px;\">↺<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin-bottom:8px;\">Crash recovery<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8f8c86; line-height:1.65;\">Killed mid-cycle? Committed work survives on its branch; the next run resumes from where it died.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:24px; border:1px solid #1e1e24; border-radius:14px; background:#0e0e11;\">\n        <div style=\"font-size:20px; margin-bottom:14px;\">⑃<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin-bottom:8px;\">Concurrent cycles<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8f8c86; line-height:1.65;\">Drive one repo with several cycles at once. File-overlap and post-merge re-tests guard the integration branch.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:24px; border:1px solid #1e1e24; border-radius:14px; background:#0e0e11;\">\n        <div style=\"font-size:20px; margin-bottom:14px;\">◈<\u002Fdiv>\n        <div style=\"font-size:16px; font-weight:700; margin-bottom:8px;\">Verified merges<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8f8c86; line-height:1.65;\">When a PR bridge is available, orch only prints “merged” after confirming the commit landed on origin/main.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== agents ===== -->\n  <section id=\"agents\" style=\"padding:20px 40px 90px; max-width:1080px; margin:0 auto; text-align:center;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:2px; color:var(--accent,#ff8a1e); text-transform:uppercase;\">Bring your own agents<\u002Fdiv>\n    <h2 style=\"font-size:32px; font-weight:800; letter-spacing:-1px; margin:14px 0 36px;\">Pluggable adapters<\u002Fh2>\n    <div style=\"display:flex; flex-wrap:wrap; justify-content:center; gap:12px; max-width:760px; margin:0 auto;\">\n      <span style=\"padding:10px 20px; border:1px solid #2a2a2e; border-radius:10px; background:#0e0e11; font-size:14px; color:#e6e4e0;\">claude<\u002Fspan>\n      <span style=\"padding:10px 20px; border:1px solid #2a2a2e; border-radius:10px; background:#0e0e11; font-size:14px; color:#e6e4e0;\">codex<\u002Fspan>\n      <span style=\"padding:10px 20px; border:1px solid #2a2a2e; border-radius:10px; background:#0e0e11; font-size:14px; color:#e6e4e0;\">copilot<\u002Fspan>\n      <span style=\"padding:10px 20px; border:1px solid #2a2a2e; border-radius:10px; background:#0e0e11; font-size:14px; color:#e6e4e0;\">gemini<\u002Fspan>\n      <span style=\"padding:10px 20px; border:1px dashed #2a2a2e; border-radius:10px; background:transparent; font-size:14px; color:#8f8c86;\">qwen3-coder-30b<\u002Fspan>\n      <span style=\"padding:10px 20px; border:1px dashed #2a2a2e; border-radius:10px; background:transparent; font-size:14px; color:#8f8c86;\">deepseek-coder-v2-lite<\u002Fspan>\n      <span style=\"padding:10px 20px; border:1px dashed #2a2a2e; border-radius:10px; background:transparent; font-size:14px; color:#8f8c86;\">glm-4.5-air<\u002Fspan>\n      <span style=\"padding:10px 20px; border:1px dashed #33291a; border-radius:10px; background:transparent; font-size:14px; color:var(--accent,#ff8a1e);\">+ add your own<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:13px; color:#5a5852; margin-top:26px;\">Pin roles in <span style=\"color:#8f8c86;\">orch.yml<\u002Fspan>, or let the pool rotate the author each cycle.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ===== commands ===== -->\n  <section id=\"commands\" style=\"padding:20px 40px 100px; max-width:820px; margin:0 auto;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:2px; color:var(--accent,#ff8a1e); text-transform:uppercase; text-align:center;\">Core commands<\u002Fdiv>\n    <h2 style=\"font-size:32px; font-weight:800; letter-spacing:-1px; text-align:center; margin:14px 0 40px;\">The essentials<\u002Fh2>\n    <div style=\"border:1px solid #1e1e24; border-radius:14px; overflow:hidden; background:#0e0e11;\">\n      <div style=\"display:grid; grid-template-columns:230px 1fr; gap:0; border-bottom:1px solid #17171b; padding:16px 22px;\"><span style=\"color:var(--accent,#ff8a1e);\">orch init<\u002Fspan><span style=\"color:#8f8c86; font-size:13.5px;\">scaffold config + verify agent CLIs on PATH<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:230px 1fr; gap:0; border-bottom:1px solid #17171b; padding:16px 22px;\"><span style=\"color:var(--accent,#ff8a1e);\">orch task <span style=\"color:#ffbf5c;\">\"fix X\"<\u002Fspan><\u002Fspan><span style=\"color:#8f8c86; font-size:13.5px;\">author + cross-audit + gate + merge — one cycle<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:230px 1fr; gap:0; border-bottom:1px solid #17171b; padding:16px 22px;\"><span style=\"color:var(--accent,#ff8a1e);\">orch review <span style=\"color:#8f8c86;\">&lt;branch&gt;<\u002Fspan><\u002Fspan><span style=\"color:#8f8c86; font-size:13.5px;\">audit an existing branch, no authoring<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:230px 1fr; gap:0; border-bottom:1px solid #17171b; padding:16px 22px;\"><span style=\"color:var(--accent,#ff8a1e);\">orch pr <span style=\"color:#8f8c86;\">&lt;n&gt;<\u002Fspan><\u002Fspan><span style=\"color:#8f8c86; font-size:13.5px;\">audit a GitHub PR, comment the verdict, optionally merge<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:230px 1fr; gap:0; padding:16px 22px;\"><span style=\"color:var(--accent,#ff8a1e);\">orch dashboard<\u002Fspan><span style=\"color:#8f8c86; font-size:13.5px;\">live cycle status, run history, success-rate metrics<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center; color:#8f8c86; font-size:13px; margin-top:18px;\">Plus orch issue, orch agent add\u002Fbuild, and shell completion — run orch --help for the rest.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== footer ===== -->\n  <footer style=\"border-top:1px solid #1a1a1e; padding:40px; display:flex; align-items:center; gap:14px; max-width:1080px; margin:0 auto; flex-wrap:wrap;\">\n    <dc-import name=\"Orch Mark\" theme=\"dark\" show-dots=\"{{ false }}\" bw=\"6.5\" cw=\"11\" radius=\"7\" tile-bg=\"linear-gradient(145deg,#1c1c20,#111114)\" tile-border=\"#2a2a2e\" style=\"width:26px; height:26px; flex:none;\" hint-size=\"26px,26px\"><\u002Fdc-import>\n    <span style=\"font-weight:800;\">orch<\u002Fspan>\n    <span style=\"color:#5a5852; font-size:13px;\">agents orchestration tool<\u002Fspan>\n    <span style=\"margin-left:auto; color:#5a5852; font-size:12.5px;\">Node ≥ 18 · PolyForm Noncommercial 1.0.0 · @agentorchbot<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff8a1e&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#ff8a1e&quot;,&quot;#ffbf5c&quot;,&quot;#6ea8d8&quot;,&quot;#63c088&quot;]},&quot;showLicenseNote&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      accent: this.props.accent ?? \"#ff8a1e\",\n      showLicenseNote: this.props.showLicenseNote ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
