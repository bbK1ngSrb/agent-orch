name: tag-release
# main only advances via the orch/integration → main PR (see .orch/ORCH.md).
# orch bumps package.json on orch/integration but never tags main itself, so
# without this, released versions silently go untagged/unpublished/unreleased.
# One push can carry several `chore(release)` commits (orch batches cycles before
# the PR is merged), so tag every version the push introduced — reading only the
# final package.json version drops the intermediate ones forever (#409).
on:
  push:
    branches: [main]
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # walking the push range needs history, not a shallow tip
      - name: tag every release version the push introduced
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Oldest-first `<sha> <tag>` lines, so tags land in version order. The
          # script is deliberately trusted repo code on main (post-review), which
          # is why a job holding `contents: write` may run it — do not route
          # agent-authored or PR-head code through this step.
          #
          # The design proposes liberally and lets `ls-remote` filter: the range
          # walk follows merges, so it can re-propose an already-tagged version,
          # and the tip is always proposed even when no release commit matched.
          # The per-tag existence check below is what makes that safe — keep it
          # inside the loop if you ever tighten the range.
          #
          # Assign first, loop second (#415). `set -e` aborts on a failing simple
          # command; a substitution in a redirection word (`done <<< "$(node …)"`)
          # is not one, so a crashed script used to leave an empty herestring, a
          # loop that tagged nothing, and a green check. An assignment IS a simple
          # command, so errexit sees the exit code here.
          TAGS="$(node scripts/release-tags.js "$BEFORE" "$AFTER")"
          while read -r SHA TAG; do
            [ -n "${TAG:-}" ] || continue
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "tag $TAG already exists, skipping"
              continue
            fi
            git tag -a "$TAG" -m "$TAG" "$SHA"
            git push origin "$TAG"
          done <<< "$TAGS"
