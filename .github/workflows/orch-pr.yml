name: orch-pr
# Audit a PR with agent-orch and post the verdict as a comment.
#
# Requires a SELF-HOSTED runner labelled `orch`: the agent CLIs (claude, codex)
# and their API keys live there, not on GitHub-hosted runners. Set the keys as
# runner env / secrets so the agent CLIs can authenticate. `gh` auths via the
# built-in GITHUB_TOKEN.
#
# Triggers: a PR labelled `orch-review`, or manual dispatch with a PR number.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to audit
        required: true

permissions:
  contents: write        # merge with --merge
  pull-requests: write   # post the verdict comment

# One audit per PR at a time — matches orch's own .orch/lock.
concurrency:
  group: orch-pr-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  audit:
    # Trust gate. The label can only be applied by a collaborator, AND fork PRs
    # are blocked from this self-hosted runner — their code (npm install scripts,
    # the PR's own tests run by `orch pr`) is untrusted and would otherwise
    # execute on the runner with access to its secrets/network. Fork PRs must be
    # audited locally instead. workflow_dispatch is collaborator-only (manual).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'orch-review' && github.event.pull_request.head.repo.fork == false)
    runs-on: [self-hosted, orch]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: npm install -g .
      - name: orch pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          case "$PR" in
            ''|*[!0-9]*) echo "invalid PR number: $PR" >&2; exit 1 ;;
          esac
          # A step fails when its last command exits nonzero, so this job cannot
          # read orch's exit code as anything but pass/fail unless we look at it
          # ourselves. That distinction matters: orch's exit table (src/exit-codes.js)
          # reserves 5 for ACTION_REQUIRED — the cycle succeeded and approved the PR,
          # and a human now has to merge it. Letting the default behaviour stand would
          # turn this job red on exactly the runs that went well (#619). Enumerate the
          # success codes instead, and let every other code fail the job as before.
          rc=0
          orch pr "$PR" || rc=$?
          case "$rc" in
            0) echo "orch pr: merged or approved (exit 0)" ;;
            5) echo "orch pr: approved — a human merge is required (exit 5, ACTION_REQUIRED)" ;;
            *) echo "orch pr: failed with exit $rc" >&2; exit "$rc" ;;
          esac
