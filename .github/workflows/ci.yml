name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - run: npm ci || npm install
      # Windows leg is advisory, not gating: a real functional gap remains in
      # reclaimOrphanWorktrees' path matching on Windows (tracked in #134),
      # unresolved without a Windows host to debug interactively. Visible here
      # so regressions/fixes show up, but it does not block merges yet.
      - run: npm test
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
      # Linux-only steps: the invariant lint needs bash glob expansion (pwsh
      # passes *.yml literally) and one run of a repo-level check suffices.
      - name: token-step invariant (§3g)
        if: runner.os == 'Linux'
        run: node scripts/lint-token-step.js .github/workflows/*.yml
      - name: bash selftest
        if: runner.os == 'Linux'
        run: |
          if [ -f harness/orch-loop.sh ]; then
            bash harness/orch-loop.sh --selftest
          else
            echo "harness/orch-loop.sh absent on this ref, skipping"
          fi
