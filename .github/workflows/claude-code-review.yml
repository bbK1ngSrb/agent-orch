name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Trusted, same-repo PRs only: fork PRs can't read the OAuth secret anyway
    # (the run would just fail), and on a public repo an unguarded trigger lets
    # any PR author consume the maintainer's Claude quota.
    if: |
      github.event.pull_request.head.repo.fork == false &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the GITHUB_TOKEN is scoped per job, so a read-only
      # pull-requests scope makes it physically impossible for the review agent
      # to publish a review or an inline comment — the API call is rejected and
      # the job still exits 0. See issue #495.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: `git diff base...head` needs the merge base locally,
          # which a depth-1 shallow clone does not have.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The slash command stays on the first line so it is parsed as a
          # command invocation; everything after the blank line is a follow-up
          # instruction to the same agent, which already holds its own findings
          # in context. That is why this needs no second workflow: `--comment`
          # posts inline comments and never sets a review state, so there is no
          # `CHANGES_REQUESTED` event for another job to trigger on.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Then, once the review is posted: if any finding you reported is a
            correctness bug — not a style nit, not a simplification suggestion —
            leave one summary comment on the PR proposing the next step, saying
            which finding to fix first and how. If every finding is a nit, or
            there were no findings at all, post nothing; a "looks good" comment
            on every PR trains people to stop reading them.

            Before writing that comment, look for an existing comment of yours
            on this PR carrying the marker `review-triage:PR-${{ github.event.pull_request.number }}`.
            The review re-runs on every push, so without this check a PR that
            takes five pushes collects five near-identical comments. If the
            marker is there, edit that comment in place
            (`gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=...`);
            if it is not, post a new one. Either way the body must contain the
            marker line.

            Do not edit files and do not open a pull request: agent-authored
            changes to this repository route through the orch pipeline, not
            through you. Your output is the review plus at most one comment.
          allowed_bots: 'orch-bot[bot]'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # A green check that means "the job exited 0" is decoration, not a gate.
      # If the agent had a tool call refused, say so loudly instead.
      - name: Fail if the review agent was blocked
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          # -e/-o pipefail: an unreadable or malformed log must go red, not
          # silently green — that failure mode is the whole point of this step.
          # jq -s slurps, so this reads both a JSON array and newline-delimited
          # JSON; `..` then walks whatever shape the log happens to have.
          set -euo pipefail
          denials=$(jq -s '[.. | objects | .permission_denials_count? // empty] | max // 0' \
            "$EXECUTION_FILE")
          echo "permission_denials_count: $denials"
          if [ "${denials:-0}" -gt 0 ]; then
            echo "::error::Review agent had $denials tool call(s) denied; the review is incomplete." >&2
            exit 1
          fi
