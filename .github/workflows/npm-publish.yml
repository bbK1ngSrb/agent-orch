name: npm-publish
on:
  push:
    tags:
      - "v*"
  # tag-release.yml pushes tags using the default GITHUB_TOKEN, and GitHub
  # Actions deliberately does not cascade-trigger other workflows from
  # GITHUB_TOKEN-authored pushes (loop prevention) — so this workflow never
  # fires for bot-created tags. workflow_dispatch is the recovery path.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.3.11)"
        required: true
jobs:
  # Cheap gate ahead of the 3-OS matrix: a bogus workflow_dispatch tag should
  # fail here, not after burning three checkouts+installs in pack-test.
  validate:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag input: $TAG_INPUT (expected vX.Y.Z)"
            exit 1
          fi
  # Real install/update/uninstall smoke test on all 3 target OSes, run from
  # the tarball `npm pack` produces — not `npm test` (which only proves the
  # source works, never that packaging/bin-wiring survives a real `npm
  # install -g`). Gates publish: a broken tarball never reaches the registry.
  pack-test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci || npm install
      - name: pack tarball
        shell: bash
        run: |
          TGZ="$(npm pack | tail -1)"
          test -f "$TGZ"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"
      - name: install from tarball
        shell: bash
        run: npm install -g "./$TGZ"
      - name: sanity-run installed CLI
        shell: bash
        run: orch --version
      - name: reinstall (update path)
        shell: bash
        run: npm install -g "./$TGZ"
      - name: uninstall
        shell: bash
        run: |
          npm uninstall -g @bbk1ng/agent-orch
          hash -r
          if command -v orch >/dev/null 2>&1; then
            echo "orch still on PATH after uninstall"
            exit 1
          fi
  publish:
    needs: pack-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci || npm install
      - run: npm test
      - name: verify tag matches package.json version
        env:
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TAG_REF#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm publish --provenance --access public
  # Separate job: holds the write token but runs no dependency/test code
  # (checkout only, no npm install) — keeps the write token off the box that
  # ran authored/third-party code in the publish job (§3g invariant).
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$TAG_REF" --generate-notes --repo "$GITHUB_REPOSITORY"
